  - name: questions
    label: Quick questions
    label_singular: Question
    folder: src/content/questions
    extension: yaml
    format: yaml
    create: true
    slug: "{{fields.label.hu}}"
    identifier_field: label.hu
    summary: "{{label.hu}}"
    sortable_fields:
      - order
    description: Optional choice questions on the interest and application forms.
    fields:
      - name: active
        label: Asked
        widget: boolean
        default: true
      - name: label
        label: Question
        widget: object
        collapsed: false
        required: true
        fields:
          - name: hu
            label: Magyar
            widget: string
            required: true
          - name: en
            label: English
            widget: string
            required: false
            hint: "Empty: the Hungarian text is shown."
      - name: help
        label: Help text
        widget: object
        collapsed: false
        required: false
        fields:
