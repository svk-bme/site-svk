# Sveltia CMS configuration (https://sveltiacms.app). Mirrors src/content.config.ts; change both together.
# Template: the build serves it as /admin/config.yml (src/pages/admin/config.yml.ts) and fills in
# site_url, display_url and public_folder from the site address and base path.
# Bilingual fields are objects with hu and en. Dates are Budapest wall-clock times (2027-04-15T18:00);
# the build adds the offset valid on that date.
# backend: the git project the editor commits to; app_id is the Client ID of its OAuth application (see README).

backend:
  name: gitlab
  repo: svk/site-svk
  branch: main
  base_url: https://git.sch.bme.hu
  api_root: https://git.sch.bme.hu/api/v4
  auth_type: pkce
  app_id: 31f4c02e89574e32534c6110e18b3296ddd6b83e226fdb1f1b6d5c48c6bd0540
media_folder: public/uploads
public_folder: /uploads # base path added by the build
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"
collections:
  - name: events
    label: Events
    label_singular: Event
    folder: src/content/events
    extension: yaml
    format: yaml
    create: true
    slug: "{{fields.title.hu}}"
    identifier_field: title.hu
    summary: "{{title.hu}} ({{start | date('YYYY-MM-DD')}})"
    sortable_fields:
      - start
      - title.hu
    media_folder: /src/content/events
    public_folder: ""
    fields:
      - name: draft
        label: Draft (only on the preview site)
        widget: boolean
        default: true
      - name: title
        label: Title
        widget: object
        collapsed: false
        required: true
        fields:
          - name: hu
            label: Magyar
            widget: string
            required: true
          - name: en
            label: English
            widget: string
            required: false
            hint: "Empty: the Hungarian text is shown."
      - name: start
        label: Start
        widget: datetime
        format: YYYY-MM-DDTHH:mm
        hint: Budapest time
      - name: end
        label: End
        widget: datetime
        format: YYYY-MM-DDTHH:mm
        hint: Budapest time
        required: false
      - name: place
        label: Place
        widget: object
        collapsed: false
        required: false
        fields:
          - name: hu
            label: Magyar
            widget: string
            required: false
          - name: en
            label: English
            widget: string
            required: false
            hint: "Empty: the Hungarian text is shown."
      - name: speaker
        label: Speaker
        widget: object
        collapsed: false
        required: false
        fields:
          - name: hu
            label: Magyar
            widget: string
            required: false
          - name: en
            label: English
            widget: string
            required: false
            hint: "Empty: the Hungarian text is shown."
      - name: description
        label: Description
        widget: object
        collapsed: false
        required: false
        fields:
          - name: hu
            label: Magyar
            widget: markdown
            required: false
          - name: en
            label: English
            widget: markdown
            required: false
            hint: "Empty: the Hungarian text is shown."
      - name: image
        label: Image
        widget: image
        required: false
      - name: image_alt
        label: Image description (for screen readers)
        widget: object
        collapsed: false
        required: false
        fields:
          - name: hu
            label: Magyar
            widget: string
            required: false
          - name: en
            label: English
