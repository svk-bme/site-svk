            hint: "Empty: open right away"
            required: false
          - name: closes
            label: Closes
            widget: datetime
            format: YYYY-MM-DDTHH:mm
            hint: "Empty: when the event starts"
            required: false
          - name: extra_fields
            label: Extra questions
            widget: list
            required: false
            fields:
              - name: label
                label: Question
                widget: object
                collapsed: false
                required: true
                fields:
