          - name: hu
            label: Magyar
            widget: string
            required: false
          - name: en
            label: English
            widget: string
            required: false
            hint: "Empty: the Hungarian text is shown."
      - name: description
        label: Description
        widget: object
        collapsed: false
        required: false
        fields:
          - name: hu
            label: Magyar
            widget: markdown
            required: false
          - name: en
            label: English
            widget: markdown
            required: false
            hint: "Empty: the Hungarian text is shown."
      - name: image
        label: Image
        widget: image
        required: false
      - name: image_alt
        label: Image description (for screen readers)
        widget: object
        collapsed: false
        required: false
        fields:
          - name: hu
            label: Magyar
            widget: string
            required: false
          - name: en
            label: English
            widget: string
            required: false
            hint: "Empty: the Hungarian text is shown."
      - name: external_link
        label: External link (tiles link here instead of the event page)
        widget: string
        required: false
        pattern:
          - ^https?://[^ ]+$
          - Enter a full address starting with https://
      - name: album_link
        label: Photo album link
        widget: string
        required: false
        pattern:
          - ^https?://[^ ]+$
          - Enter a full address starting with https://
      - name: registration_form
        label: Registration form (Google Forms)
        widget: object
        collapsed: false
        required: false
        hint: "Shown on the event page until the event starts. In Google Forms: Send → link icon → copy the long link (do not shorten it)."
        fields:
          - name: hu
            label: Magyar
            widget: string
            required: false
            pattern: &a1
              - ^https://docs.google.com/forms/d/e/[A-Za-z0-9_-]+/viewform
              - Paste the full Google Forms link (…/forms/d/e/…/viewform), not a forms.gle short link
          - name: en
            label: English
            widget: string
            required: false
            pattern: *a1
            hint: "Empty: the English page shows the Hungarian form."
