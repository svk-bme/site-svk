                    label: Magyar
                    widget: string
                    required: true
                  - name: en
                    label: English
                    widget: string
                    required: false
                    hint: "Empty: the Hungarian text is shown."
              - name: help
                label: Help text
                widget: object
                collapsed: false
                required: false
                fields:
                  - name: hu
                    label: Magyar
                    widget: string
                    required: false
                  - name: en
                    label: English
                    widget: string
                    required: false
                    hint: "Empty: the Hungarian text is shown."
              - name: type
                label: Type
                widget: select
                options:
                  - label: Short text
                    value: text
                  - label: Long text
                    value: textarea
                  - label: Single choice
                    value: single_choice
                  - label: Multiple choice
                    value: multiple_choice
                  - label: Checkbox (yes/no)
                    value: checkbox
              - name: options
                label: Options (for choice types)
                widget: list
                required: false
                summary: "{{hu}}"
                fields:
                  - name: hu
                    label: Magyar
                    widget: string
                  - name: en
                    label: English
                    widget: string
                    required: false
                  - name: value
                    label: Stored value
                    widget: string
                    required: false
                    pattern:
                      - ^[a-z0-9_]*$
                      - Lowercase letters, digits and _ only
                    hint: "Optional. Keeps answers stable if you later rename the option. Empty: made from the Hungarian text."
              - name: required
                label: Required
                widget: boolean
                default: false
              - name: id
                label: Column key
                widget: string
                required: false
                pattern:
                  - ^[a-z0-9_]*$
                  - Lowercase letters, digits and _ only
                hint: "Optional. Keeps the sheet column stable if you later change the question. Empty: made from the Hungarian question."
            summary: "{{label.hu}}"
            hint: Name, email, studies and consent are always asked.
