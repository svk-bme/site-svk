            widget: string
            required: false
          - name: en
            label: English
            widget: string
            required: false
            hint: "Empty: the Hungarian text is shown."
      - name: type
        label: Type
        widget: select
        options:
          - label: Single choice
            value: single_choice
          - label: Multiple choice
            value: multiple_choice
      - name: options
        label: Options
        widget: list
        summary: "{{hu}}"
        fields:
          - name: hu
            label: Magyar
            widget: string
          - name: en
            label: English
            widget: string
            required: false
          - name: value
            label: Stored value
            widget: string
            required: false
            pattern:
              - ^[a-z0-9_]*$
              - Lowercase letters, digits and _ only
            hint: "Optional. Keeps answers stable if you later rename the option. Empty: made from the Hungarian text."
      - name: forms
        label: Ask on
        widget: select
        multiple: true
