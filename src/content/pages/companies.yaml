title:
  hu: Cégeknek
  en: For companies
description:
  hu: Mit kínálunk partnereinknek, és hogyan dolgozhatunk együtt.
  en: What we offer our partners and how we can work together.
intro:
  hu: Segítünk, hogy céged ismert és vonzó munkahely legyen a BME mérnök- és informatikushallgatói körében.
  en: We help your company become a known and attractive employer among the engineering and IT students of BME.
body:
  hu: |-
    ## Amit kínálunk

    - Megjelenés a legnagyobb campus rendezvényeken (Simonyi Konferencia, Schönherz Qpa, Gólyatábor, Gólyabál)
    - Saját szervezésű szakmai előadások, workshopok és céglátogatások
    - Közvetlen kapcsolat a hallgatókkal és hallgatói szervezetekkel
  en: |-
    ## What we offer

    - Presence at the largest campus events (Simonyi Conference, Schönherz Qpa, Freshman Camp, Freshman Ball)
    - Professional talks, workshops and company visits organized by us
    - Direct contact with students and student organizations
