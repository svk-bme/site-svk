title:
  hu: Rólunk
  en: About us
description:
  hu: Kik vagyunk, mivel foglalkozunk, és kik dolgoznak az SVK-ban.
  en: Who we are, what we do, and the people of SVK.
image: ./about.jpg
intro:
  hu: Csoportunk az employer branding területén tevékenykedik a Schönherz Kollégium és az ipar meghatározó résztvevői között.
  en: Our group works in employer branding between the Schönherz College and key players of the industry.
body:
  hu: |-
    ## Mivel foglalkozunk?

    A célunk, hogy egy hatékony kommunikációs híd jöjjön létre a hallgatók és a vállalatok között, amely lehetővé teszi mindkét fél számára, hogy kölcsönösen megismerjék egymást. Ennek eredményeként a hallgatók már az egyetemi éveik alatt megismerik és megértik a cégek tevékenységi területeit, ami jelentősen megkönnyíti számukra az elhelyezkedést a munka világában.

    Ebben a folyamatban kiemelt figyelmet fordítunk arra, hogy médiajelenlétet biztosítsunk a cégeknek a legnagyobb campus rendezvényeken, mint például a Simonyi Konferencia, a Schönherz Qpa, a Gólyatábor és a Gólyabál, valamint saját szervezésű eseményeinken, mint például szakmai előadások, tanfolyamok és vállalatlátogatások. Ezáltal lehetőséget teremtünk a cégeknek arra, hogy közvetlen kapcsolatot alakítsanak ki a tehetséges hallgatókkal, és bemutassák szolgáltatásaikat és lehetőségeiket a jövő munkaerőjének.
  en: |-
    ## What do we do?

    Our goal is to create an efficient communication bridge between students and companies, which allows both parties to get to know each other. As a result, students get to know and understand the business areas of companies during their university years, which makes it much easier for them to find their place in the working world.

    In this process, we pay special attention to providing media presence for companies at the largest campus events, such as the Simonyi Conference, the Schönherz Qpa, Freshman Camp and Freshman Ball, as well as at our own events, such as professional lectures, courses and company visits. This way, companies can establish direct contact with talented students and show their opportunities to the future workforce.
