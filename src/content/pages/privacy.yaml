title:
  hu: Adatkezelés
  en: Privacy
description:
  hu: Milyen adatokat kezelünk, miért, meddig, és hogyan kérheted a törlésüket.
  en: What data we process, why, for how long, and how to have it deleted.
intro:
  hu: |-
    Az oldal űrlapjain megadott adataidat a Schönherz Vállalati Kapcsolatok kezeli. Adatkezeléssel kapcsolatos kérdéseiddel írj nekünk a lent megadott címre.

    Az oldal nem használ sütiket.
  en: |-
    The data you enter in the forms on this site is processed by Schönherz Corporate Relations. Write to the address below with any question about your data.

    This site uses no cookies.
