title:
  hu: Adatkezelés
  en: Privacy
description:
  hu: Milyen adatokat kezelünk, miért, meddig, és hogyan kérheted a törlésüket.
  en: What data we process, why, for how long, and how to have it deleted.
intro:
  hu: |-
    Az oldal űrlapjain megadott adataidat a Schönherz Vállalati Kapcsolatok kezeli. Adatkezeléssel kapcsolatos kérdéseiddel írj nekünk a lent megadott címre.

    Az űrlapok a Google Forms szolgáltatással működnek: a válaszokat és a feltöltött fájlokat az SVK Google-fiókjában (Google Drive) tároljuk, a Google ebben az SVK adatfeldolgozója.

    Az oldal maga nem használ sütiket. Egy űrlap csak akkor töltődik be, ha a megjelenítés gombra kattintasz; ekkor a Google sütiket helyezhet el.
  en: |-
    The data you enter in the forms on this site is processed by Schönherz Corporate Relations. Write to the address below with any question about your data.

    The forms run on Google Forms: answers and uploaded files are stored in SVK's Google account (Google Drive), with Google processing them on SVK's behalf.

    This site itself uses no cookies. A form loads only when you click its button; Google may then set cookies.
