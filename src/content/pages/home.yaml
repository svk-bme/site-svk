title:
  hu: Híd a jövő szakembereihez
  en: Bridge to the professionals of the future
description:
  hu: A Schönherz Vállalati Kapcsolatok (SVK) employer branding szolgáltatásokkal köti össze a mérnök- és informatikushallgatókat a cégekkel.
  en: Schönherz Corporate Relations (SVK) connects engineering and IT students with companies through employer branding services.
intro:
  hu: |-
    Employer branding szolgáltatások mérnöki és informatikai területen.

    Csoportunk a Schönherz Kollégium és az ipar meghatározó szereplői között dolgozik azon, hogy a hallgatók már az egyetemi éveik alatt megismerjék a cégeket, a cégek pedig a jövő szakembereit.
  en: |-
    Employer branding services in engineering and information technology.

    Our group works between the Schönherz College and key players of the industry so that students get to know companies during their university years, and companies get to know the professionals of the future.
