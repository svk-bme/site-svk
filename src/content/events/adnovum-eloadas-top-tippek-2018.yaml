description:
  hu: |-
    TOP 5 dolog, amiről lemaradhatsz az egyetemen, avagy
    hogyan légy sikeres már az első hónapokban is a munkahelyeden!

    Ha érdekesnek hangzik a téma a számodra, akkor gyere el. Tapasztalt kollégáink elárulják a sikeres karrier megkezdésének alapjait  egy finom pizza mellett.

    Hogy mivel is foglalkozunk?
    Az AdNovum egy svájci szoftverfejlesztő vállalat, amely öt országban (Svájc, Magyarország, Portugália, Szingapúr, Vietnám) van jelen. Nemzetközi piacra fejlesztünk biztonságtechnikai, illetve egyénre szabott szoftvereket.

    Tippeink mellett, minden résztvevőnek apró ajándékkal kedveskedünk!
