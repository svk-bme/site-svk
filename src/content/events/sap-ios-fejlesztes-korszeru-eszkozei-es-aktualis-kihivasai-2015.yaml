description:
  hu: |-
    iOS fejlesztés korszerű eszközei és aktuális kihívásai Objective-C és Swift programozási környezetben, egy SAP szoftverfejlesztő szemszögéből

    A Swift és az Objective-C együttélése - egy SAP szoftverfejlesztő tapasztalatai

    "Bizonyos programozási nyelvek jól megférnek egymás melett. Ennek gyakorlati és evolúciós okai vannak.
    Az Apple által nemrég kifejlesztett Swift és a megbízható, jól bejáratott, de régi terheket magával cipelő Objective-C nászának is oka van. Ez az előadás az Objective-C és a Swift együttéléséről, annak szépségeiről és árnyoldalairól szól.”
    “Objective-C is not going away, both Swift and Objective-C are first class citizens for doing Cocoa and Cocoa Touch development.” - Apple

    Tovább a cég oldalára:
    www.sap.hu
