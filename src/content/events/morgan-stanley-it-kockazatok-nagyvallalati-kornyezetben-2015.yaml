description:
  hu: |-
    Az IT és annak megfelelő működése ma már minden vállalat számára fontos, a közepes és annál nagyobb cégek számára pedig kritikus.

    A Morgan Stanley előadásában az IT-kockázatkezelés alapfogalmait és elvét ismerhetitek meg röviden, továbbá szó lesz arról, nagyvállalati szinten hogyan ügyelnek az IT megfelelő működésére a kockázatkezelés szemszögéből.
