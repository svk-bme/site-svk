description:
  hu: "G\byere el a BME Q épületébe november 5-én, csütörtökön 17:00-kor és frissítsd a tudásod! Természetesen ingyen és sallangok nélkül. Az Open Academy egy non-profit közösségi rendezvény, melynek célja a hazai informatikai kultúra és oktatás fejlesztése.


    Az előadók között köszönthetjük az Alphasonic, a Balabit, a BME CrySyS Lab, a Cloudera, a Hortonworks és a Nextent Informatika szakembereit. Ami pedig az előadásokat illeti, a hagyományokhoz híven most ősszel is az üzemeltetés kerül fókuszba. A teljesség igénye nélkül hallhatsz a DevOps szemlélet mindennapi előnyeiről, annak eszközeiről PaaS környezetben (Packer, Terraform, OpenStack), biztonságos IT üzemeltetésről, továbbá modern biztonságtechnikai video rendszerekkel és a Hadooppal is találkozhatsz, több aspektusból.\b\b\b"
