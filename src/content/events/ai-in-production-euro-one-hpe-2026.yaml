description:
  hu: "Szakmai est a mesterséges intelligencia vállalati alkalmazásairól: hogyan léphetünk túl a ChatGPT hétköznapi használatán, mire bízhatjuk az AI-t és hol kell emberi kontroll, és mi történik, ha egy vállalat a saját adataival tanítja. Utána kötetlen beszélgetés a közösségi térben."
  en: "A professional evening on artificial intelligence in companies: going beyond everyday ChatGPT use, what to trust AI with and where human control is needed, and what happens when a company trains it on its own data. Followed by an informal chat in the community space."
