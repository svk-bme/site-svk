description:
  hu: |-
    Kíváncsi vagy hol készítik a világ egyik vezető navigációs szofverét, ami világszerte több mint 30 autómárkában megtalálható? Látogass el hozzánk, és ismerd meg történetünk, hogyan lett az NNG 10 év alatt egy garázscégből egy közel 1000 fős nagyvállalat, és mire képes az iGO Navigáció! A Nyílt Napunkon megtudhatod, hogyan navigálnak a világ különböző tájain, megmutatjuk az exkluzív demo szobánkat, ahol megnézheted milyen újdonságokat fejlesztünk a jövő okos autóiba!

    Program:

    15:00 – Köszöntő (Magyari Andrea – HR Director)
    15:30 – iGo Navfusion (Szendi Ákos – Team Leader) – ez az egyik fejlesztés alatt álló legújabb termékünkről fog szólni
    16:00 – Demo szoba körbevezetés (Kiss László – Product Specialist) – a piacon elérhető termékeink bemutatója, ki is próbálhatják az érdeklődők a termékeket)
    17:00 – Irodai körbevezetés (Kálmán Kristóf – Communication Specialist)

    NNG Budapest Campus
    1037 Budapest, Szépvölgyi út 35-37.
    [ 47°31’43.21”N 19° 2’1.44” E]
