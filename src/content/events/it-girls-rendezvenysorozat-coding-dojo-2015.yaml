description:
  hu: |-
    A Coding Dojo során amellett, hogy megtudhatod miért fontos a tiszta kód, a gyakorlatban is kipróbálhatod hogyan kell ‘tisztán’ kódolni.
    Tapasztald meg első kézből mit tanultál egy gyakorlati példa megoldásával. Mindebben segítségedre lesznek a téma szakértői, akik a végén értékelik a teljesítményedet és hasznos tippekkel látnak el.
    Amit feltétlenül hozz magaddal: saját laptop, kreativitás és lelkesedés.
