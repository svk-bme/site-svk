    XV. SCHÖNHERZ MEETUP - "Vállalkozók az informatika világában"

    A Schönherz Vállalati Kapcsolatok immáron tizenötödik alkalommal rendezi meg a Schönherz Meetup néven ismert egész estés rendezvényét, amely lehetőséget nyújt a hallgatóknak bepillantani egy izgalmas témába három előadáson keresztül.

    ELŐADÓINK:

    -> Bánkuti Gábor // freelancer

    Tanulságok az 5 évvel ezelőtti önmagamnak. Egy nem szokványos mérnöki út története.

    -> Borbély Viktor //  piackutató, előadó

    Üzleti ötlet, koncepció és tervezés. Hogyan indíts el egy vállalkozást!

    -> Adler John David // startupper, egyetemista // Colibri Charity

    Vállalkozás indítása még egyetem alatt. Ha van egy ötleted ne habozz, csak valósítsd meg azt.
