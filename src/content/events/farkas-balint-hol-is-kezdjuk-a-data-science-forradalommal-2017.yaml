description:
  hu: |-
    Farkas Bálint: Hol is kezdjük a Data Science forradalommal?
    Presented by Microsoft

    A jelen idők talán legizgalmasabb trendje a data science. Sok néven emlegetjük - big data, machine learning és prediktív analízis -, de mind ugyanarra a jelenségre utal: arra, hogy a statisztikai módszerek, hatalmas adathalmazok és számítástechnikai tényezőkkel jobban tudjuk megjósolni a jövőt.
    Az automatizált orvosi diagnózistól a vásárlói ajánlásokon keresztül az önvezető autókig bezárólag ez mindannyiunk életére befolyással lesz majd.
    Hogyan pozícionálhatják hát magukat az éleseszű mérnök-hallgatók, hogy profitáljanak ebből a hatalmas trendből? Milyen skilleket és technológiákat kellene tanulmányozniuk? Na, pontosan erről fog a beszédem szólni.

    Jegy: ingyenes
    A résztvevők közt páros mozijegy kerül kisorsolásra!
