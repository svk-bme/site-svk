title:
  hu: Szoftverfejlesztés a Google-nél
start: 2015-11-18T18:00
end: 2015-11-18T20:00
place:
  hu: Schönherz Zoltán Kollégium
speaker: null
description:
  hu: |-
    Az előadás választ ad az alábbi kérdésekre: Milyen eszközökkel és hogyan készítik a Google mérnökei a szolgáltatások (pl. webkereső, Gmail, YouTube, Android) új verzióit (részleges és párhuzamos újrafordítás, verziókövetés, tesztek automatikus futtatása, automatikus szoftverfrissítés a szervereken)?
    Hogyan szerveződik a csapatmunka, hogyan osztják szét a feladatokat?
    Milyenek a munkakörülmények Zürichben? Milyen szakmai és munkalehetőségét kínál a Google egyetemistáknak és végzősöknek? Hogyan érdemes készülni az interjúra?

    Előadónk Szabó Péter 2004-ben szerzett informatikus diplomát a BME-n, 5 éves képzésen. Volt gyakorlatvezető és előadó a BME-n, volt rendszergazda, foglalkozott szabad szoftver tanácsadással, jelenleg szoftvermérnökként dolgozik a Google-nél Zürichben, a szöveges keresőn.
