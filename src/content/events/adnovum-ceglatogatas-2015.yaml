description:
  hu: |-
    Cégfeszt – avagy gyere és látogass meg minket az AdNovumnál!

    Mikor?

    Június 10-én, 15:00 órakor
    Indulás közösen a Schönherz Zoltán Kollégium elől 14:30-kor
    Hol?

    AdNovum Hungary Kft., 1027 Budapest, Kapás utca 11-15 (Buda Business Center, 4. emelet)

    Miért?

    Hogy közelebbről megismerkedj a céggel, hogy első kézből, „adnovumosoktól” szerezz
    tapasztalatokat és nem utolsó sorban, hogy megismerd néhány izgalmas projektünket.

    Milyen előadásokra számíthatsz?

    Munkatársaink saját projektjeiket mutatják be, amelyek a következők (az előadások anyaga angol
    nyelvű, ugyanakkor a bemutatók magyar nyelven zajlanak):
    Tóth Gábor, Junior szoftver mérnök: Nevis Security Suite - Advanced Protection of Data and
    Services
    Hetesi István, Szenior szoftver mérnök és Szabó Bálint tesztelő: Developing Mobile
    Application of a Leading Swiss Bank
    Pári Csaba Szenior, és Váraljai Fruzsina Junior szoftver mérnök: Desktop2Web

    Mire számíthatsz?

    Jó hangulatra és fesztelen környezetre 2,5 órán keresztül.
    Kíváncsi, de barátságos arcokra.
    A vállalkozó kedvűek pedig mini-interjún is részt vehetnek, hogy kipróbálják magukat és
    tudásukat.

    Gyere el és ismerj meg minket!

    Tovább a cég oldalára:
    www.adnovum.hu
