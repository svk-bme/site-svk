description:
  hu: |-
    Kíváncsi vagy miben különbözik a céges élet az egyetemi évektől?
    Mindig is érdekelt,hogy hogyan fogod alkalmazni a gyakorlatban az iskolában megtanultakat?
    Vagy tapasztalt szakmai rókaként az érdekel egy svájci cég miben más?

    Ha bármelyik kérdésre igen a válasz, akkor ez a Te lehetőséged. Egy kötetlen délutáni beszélgetés mellett minden kérdésedre szakértő munkatársaink adnak választ.

    Hogy mivel is foglalkozunk?
    Cégünk 1988-ban alapult, melynek központja Svájcban van. További irodáink Szingapúrban, Portugáliában, Vietnamban és Magyarországon találhatóak. Legfőbb feladataink a biztonságos szoftverfejlesztés és a szoftver design.

    A kellemes délutáni hangulatot a szervezők étellel, itallal garatnálják. Ezenfelül, minden résztvevőnek apró ajándékkal kedveskedünk.

    Töltsd hasznosan a délutánod, és gyere el hozzánk!
