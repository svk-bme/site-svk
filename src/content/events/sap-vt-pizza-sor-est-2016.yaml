description:
  hu: |-
    Keresel egy helyet, ahol az egyetemi mesterképzés mellett hasznos gyakorlati tapasztalatot szerezhetsz? Meg akarod ismerni a világ vezető üzletiszoftver-gyártó cégét? Találkoztál már az SAP Vocational Training (VT) programjával, de nem tudod, hogy mi is ez az egész?

    Ha bármelyik kérdésre a válaszod igen, akkor gyere el az SVK és SAP által közösen szervezett Pizza & Sör estre, ahol felteheted a kérdéseid és mindent megtudhatsz a VT programról, illetve arról, hogy mivel is foglalkoznak az SAP magyarországi irodájában. Mindezt baráti hangulatban, finom pizza és hideg sör kíséretében.

    Kezdés: Október 12. 19:00, érdemes 10 perccel korábban érkezni.

