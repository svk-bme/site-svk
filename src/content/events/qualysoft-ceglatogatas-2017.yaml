description:
  hu: |-
    Gyere látogass meg minket 2017. május 25-én 12-15 óra között a Qualysoft irodában (1118 Budapest, Rétköz u. 5.), ahol megismerkedhetsz egy IT vállalat hétköznapjával, feladataival és életével. Mindezek mellett készülünk egyéb érdekességekkel is. Mit csinálunk valójában, amikor keményebben gondolkozunk? Lehet-e számítógépet irányítani anélkül, hogy hozzáérnél bármelyik részéhez? Mekkora robotot lehet készíteni egy 3D nyomtatóban? Hogyan rajzol a rajzolórobot? Erre és még sok más kérdésre választ kaphatsz.

    A Qualysoft csoport 1999-ben alakult Bécsben független IT tanácsadó és szolgáltató cégként, amely nemzetközi ügyfeleinek testreszabott, innovatív és rugalmas megoldásokat kínál. Fő területek: pénzügyi szolgáltatások, energiaszolgáltatás, ipari és kereskedelem, média és telekommunikáció. A csoport ausztriai székhelyén kívül a Qualysoftnak három telephelye van Németországban, kettő Magyarországon, további telephelyekkel rendelkezik Svájcban, Szlovákiában, Romániában, Szerbiában, Albániában és Ukrajnában, több mint 500 szakember áll rendelkezésünkre Közép- és Kelet-Európában, akik sok éves tapasztalatuknak, szaktudásuknak és elkötelezettségüknek köszönhetően garantálják a Qualysoft projektek sikerét.
