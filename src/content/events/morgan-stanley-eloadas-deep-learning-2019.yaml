  hu: Érdekel az adatfeldolgozás, hogy hogyan lehet egy adatsorból hasznos információt kinyerni? Kíváncsi vagy milyen technológia áll a beszédfelismerés, fordítóprogramok, gépi zeneírás mögött,  valamint, hogy pénzügyben ezt mire lehet felhasználni? Ha a válaszod igen, akkor gyere el előadásunkra, ahol megismerheted hogyan működnek a neurális hálók, azon belül is a long short-term memory network, és a gated recurrent unit.
