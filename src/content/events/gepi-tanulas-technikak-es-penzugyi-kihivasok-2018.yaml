description:
  hu: |-
    Az utóbbi néhány évben egymást érik a különböző tech óriások forradalmi bejelentései önvezető autókról,
    beszédfelismerő szoftverekről, vagy Bábel-hal szerű valós időben tolmácsoló fülhallgatókról.
    A következő előadáson arról lesz szó, hogy milyen problémák felmerülése teszi szükségessé a gépi tanulást,
    hogyan is működnek ezek a modellek és hogyan könnyítik meg a fejlesztők életét.
