description:
  hu: |-
    Szeretnénk felhívni figyelmedet a National Instruments debreceni egységében megrendezésre kerülő Mérnökségi Nyílt Napra.
    Amennyiben kíváncsi vagy a kutatás-fejlesztés és gyártás fortélyaira egy elektronikai gyártócégnél, várunk Nyílt Napunkra!
    Az utazás, ebéd és vacsora költségeit erre a napra az NI állja!

    Nyílt Nap időpontja: 2015. április 10. (péntek)

    A program röviden:
    - Gyárlátogatás
    - Ismerkedés a Gyártómérnökség részlegeivel
    - Ismerkedés a Kutatás-Fejlesztéssel foglalkozó csoportokkal
    - Lehetőség próbainterjúra
    - Vacsora Debrecen belvárosában

    http://sedsurveys.ni.com/run/mernoksegi_nyilt_nap_2015_aprilis

