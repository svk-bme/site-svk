description:
  hu: |-
    Manapság egyre többet halljuk a Big Data kifejezést. Az elmúlt évek egyik fontos trendjévé nőtte ki magát, amely elengedhetetlen egy nagy cég üzleti fejlődéséhez. Mindemellett a társadalmi haladást is elősegítik ezek a technológiák.

    A következő szakmai előadásunkban a Citi  Quantitative Analyst informatikusa mutatja be a nagy adathalmazok elemzését pénzügyi területen. Az előadás tartalma:
    Mikor jó egy modell és hogyan tudjuk eldönteni, hogy melyiket használjuk? Mi a fontosabb, a pontosság vagy az értelmezhetőség? Előadásunk során ezekbe a kérdésekbe kapunk betekintést elméleti és gyakorlati oldalról.

    A résztvevő hallgatókat egy ajándékkal is meglepi a cég.
