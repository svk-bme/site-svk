description:
  hu: |-
    Szeretnénk megosztani veletek egy eseményt, amely a Morgan Stanley Technology Open Day.

    Érdekel, hogy hogyan birkózik meg a világ egyik legnagyobb befektetési bankja valós időben beözönlő hatalmas mennyiségű adattal?
    Szeretnéd megtudni, hogy milyen alkalmazásai vannak a tanult vagy épp feltörekvő technológiáknak kompetitív környezetben?
    Szeretnéd megtudni, milyen munkakörnyezetben dolgoznak a Morgan Stanley programozói? Ha ezekre a válaszod igen, ott a helyed!

    Program:

    14:00-15:00: Big Data aspects of Algorithmic trading;

    15:00-15:30: Prezentáció gyakornoki és frissdiplomás lehetőségeinkről;

    15:30-16:00: Irodatúra;

    16:00-16:30: Panelbeszélgetés;

    16:30-18:00: Technológiai demók és ismerkedés kollégáinkkal
