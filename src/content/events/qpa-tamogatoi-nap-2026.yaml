description:
  hu: "Támogatói nap az 54. Schönherz Qpán: a Qpa támogatóival lehetett találkozni a Schönherz Kollégium előtt. Versenyszimulátor, szerverépítés időre, óriás amőba, IT kvíz és további kihívások, közben pedig a MOL, a PTC, az EuroOne–HPE, a Hiya és a Schönherz Iskolaszövetkezet standjainál szakmai, gyakornoki és karrierlehetőségekről lehetett kérdezni."
  en: "Supporter day at the 54th Schönherz Qpa: students met the sponsors of Qpa in front of the Schönherz Kollégium. A racing simulator, building a server against the clock, giant tic-tac-toe, an IT quiz and more challenges, while the stands of MOL, PTC, EuroOne–HPE, Hiya and Schönherz Iskolaszövetkezet answered questions about jobs, internships and careers."
