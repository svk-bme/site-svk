  hu: |-
    Önvezető autók – Hogyan fogunk autózni 10, 15 vagy 30 év múlva?

    Hol tartanak most a fejlődésben az önvezető autók? Milyen irányba fejlődnek tovább az önvezető autók és milyen új technológiákat igényel ez a fejlődés? Milyen szerepe lehet a Vodafone-nak az önvezető autó iparban?
