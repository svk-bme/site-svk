  hu: |-
    "A Morgan Stanley hisz abban, hogy a különbözőségeinkkel együtt és nem azok ellenére alkotunk egy csapatot. Ennek szellemében hoztuk létre a Morgan Stanley IT Girls Network-öt, olyan tanulmányaikat folytató vagy éppen befejező lányok számára, akiket érdekel az IT és szeretnének érdekes szakmai és karrier témákról beszélgetni."

