description:
  hu: |-
    Szakmai előadássorozatunkat a Morgan Stanley nyitja meg a 2017-es tavaszi félévben. Ezúttal a Java szoftverfejlesztés optimalizálásához adnak kihagyhatatlan tippeket.

    „Érdekel milyen kihívásokkal szembesül az, aki Java nyelven nagy mennyiségű adatot feldolgozó, közel valós idejű rendszerek fejlesztésével foglalkozik? Szeretnéd tudni mi minden történik a háttérben egy Java program futása közben, és mit tehetünk, hogy az adatok feldolgozását még gyorsabbá tegyük?"

    Ha csak egyre is igen a válasz, érdemes részt venned a Morgan Stanley előadásán, ahol a cég egyik szakértője osztja meg a tapasztalatait és válaszol a kérdéseidre!

    A résztvevők között egy Páros mozijegyet sorsolunk ki!
