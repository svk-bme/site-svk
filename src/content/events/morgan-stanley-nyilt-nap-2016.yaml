description:
  hu: |-
    Érdekel a virtualizáció, a felhő alapú számítástechnika, a konténer technológia vagy a konfiguráció menedzsment?
    Kíváncsi vagy, hogy a nagyvállalatok, mint a Morgan Stanley, hogyan alkamazzák ezeket a technológiákat?
    Szeretnéd megtudni, hogy milyen alkalmazásai vannak a tanult vagy épp feltörekvő technológiáknak kompetitív környezetben?

    Ha a válaszod igen, gyere el a Morgan Stanley nyílt napjára! A technológiai előadás mellett lehetőséged lesz találkozni a cég fejlesztőivel, akik első kézből származó tapasztalatokat oszthatnak meg Veled.

    Emellett fontos, hogy a cég oldalán is jelezd a részvételi szándékod:
    https://morganstanley.tal.net/vx/brand-2/candidate/so/pm/1/pl/2/opp/3302-Technology-Open-Day/en-GB

    A Nyílt Nap programterve:
    13:20-13:30: Gyülekező
    14:00-15:00: A Morgan Stanley budapesti irodájának bemutatása;
    15:00-15:15: Szünet;
    15:15-15:30: Prezentáció gyakornoki és frissdiplomás lehetőségeinkről;
    15:30-15:45: Az interjú folyamat bemutatása;
    15:45-16:15: Panelbeszélgetés;
    16:15-17:00: Technikai előadás – Felhő alapú megoldások;
    17:00-17:15: Iroda túra;
    17:15-18:00: Technológiai demók és ismerkedés kollégáinkkal.

    A nyílt nap időpontja:
    2016. november 17., csütörtök (13:30 – 18:00)

    Közös gyülekező 13:20-tól a helyszínen:
    1095 Budapest, Lechner Ödön fasor 8.
    (Fontos, hogy a 8-as számhoz gyere, mert több épületben is jelen van a cég)
