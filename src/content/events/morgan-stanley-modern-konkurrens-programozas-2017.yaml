description:
  hu: |-
    Egy olyan világban, ahol a párhuzamos programozás egyre nagyobb szerepet kap, rengeteg kérdés merülhet fel :
    Tudsz-e mindent a szálakrol és a kölcsönös kizárásról?  Hogyan terveznél meg egy hatékony konkurrens adatszerkezetet?  Hasznos-e ismerni a C++ memória-modellt?  Tartsuk-e távol magunkat az std::atomic<>-tól?  Mit jelent az, hogy egy algoritmus lock-free?  Mire jó a tranzakcionális memória?

    Ezekre a kérdésekre kaphatsz választ a csütörtöki előadáson, amely az egyik leghatékonyabb nyelven, C++-ban lesz.
