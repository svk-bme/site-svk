title:
  hu: Lightware - Ismerkedj meg a professzionális videotechnikával
start: 2018-03-01T18:00
end: 2018-03-01T20:00
place: null
speaker: null
description:
  hu: |-
    Gyere és tudd meg, hogy milyen izgalmas feladatok vannak a cégünknél, melyet volt BME-s diákok alapítottak, és ami ma már a professzionális audio-videotechnikában világszinten a legjobbak között található, több, innovációs díjat nyert termékkel!

    Betekintést kaphatsz abba is, hogy hogyan zajlik egy igazi, kreatív termékfejlesztés, ahol nem az anyacég által megszabott irányvonalakat kell követni, illetve milyen izgalmas műszaki kihívásokkal szembesülünk a mindennapi munkánk során.

    Az előadás résztvevőinek lehetősége lesz megnyerni 2 db Samsonite hátizsákot és 1 db Sony bluetooth hangszórót is!

    A Lightware estet kötetlen beszélgetés, pizzázás és sörözés zárja majd.

