  en: Erika Schalkhammer, László Lengyel, Krisztián Seres, Dávid Gulyás
description:
  hu: Előadások az azonnali fizetésről, a szoftverek erejéről a pénzügyi világban és a fintech mindennapjairól. Az estét Dr. Charaf Hassan dékán nyitotta meg, a blokkok között Kertész Richárd stand-upolt.
  en: Talks on instant payments, the power of software in finance and everyday fintech work. Dean Dr. Hassan Charaf opened the evening; stand-up comedy by Richárd Kertész between the blocks.
