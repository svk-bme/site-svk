description:
  hu: |-
    A kdb+ egy testre szabható Big Data platform, amely a Q nyelvet használja. Többek között lehetővé teszi a folyamatos, valós adatok analizálását is. A banki szféra előszeretettel alkalmazza, ezért aki ebben dolgozik, kiemelkedő jövedelemre számíthat.

    Amennyiben meghallgatnál egy a témában dolgozó informatikust, várunk szeretettel a Morgan Stanley idei első előadására!
