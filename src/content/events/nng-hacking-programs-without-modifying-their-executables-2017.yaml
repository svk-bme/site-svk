description:
  hu: Csütörtökön ismét egy szakmai előadással várunk Titeket a 102-es teremben. Ezúttal az NNG egyik szakembere jön el hozzánk egy izgalmas hackelős témával, mely keretein belül elsajátíthattok pár módszert arra, hogy, hogyan crackeljünk meg egy programot a   futtatható fájlok módosítása nélkül. Példaként megmutatja Nektek, hogy hogyan tüntethetitek el a Skype idegesítő funkcióit .
