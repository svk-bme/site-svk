description:
  hu: |-
    Idén tavasszal is megrendezzük a Mérnökségi Nyílt Napot a National Instruments debreceni telephelyén.

    Ezen a napon lehetőségetek lesz betekinteni az NI-nál folyó mérnöki munkába, találkozni mérnökeinkkel, gyárlátogatáson részt venni és a nap végén akár egy próbainterjún is kipróbálhatjátok magatokat.

    A program röviden:

    - Indulás busszal Budapestről, a BME főépülete (K épület, Műegyetem rakpart) előtti parkolóból (6:15)
    - Ismerkedés a mérnöki területekkel - Tudj meg többet a gyártómérnökségről és a kutatás-fejlesztési mérnökségről!
    - Ebéd (pizza)
    - Gyárlátogatás - Nézd meg a gyártócsarnokot, ahol a National Instruments termékeinek 80%-a készül!
    - Kötetlen beszélgetés mérnökeinkkel/opcionális próbainterjú
    - Vacsora Debrecen belvárosában
    - Visszaindulás (19.00 körül)
