description:
  hu: A MOL hazánk legnagyobb gáz- és olajipari vállalata, bár lehet nem sokan tudják, de rendkívül fejlet és modern IT szektorral rendelkezik, megannyi kitűnő mérnökkel. 2022. március 31-én ezen csapat vezetője, Svébis András látogat el a Schönherz Kollégiumba és egy másfél órás szakmai előadás keretein belül az érdeklődőkkel közösen megvitatja, milyen változásokon ment keresztül az IT szektor az elmúlt, igencsak változatos időszakban.
