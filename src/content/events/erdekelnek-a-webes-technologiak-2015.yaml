description:
  hu: |-
    Kíváncsi vagy a világ egyik vezető portálrendszerére, amit olyan nagyvállalatok használnak mint a Raiffeisen Bank, az NN, az Allianz, vagy éppen a Toyota?

    Ha szeretnél megismerkedni egy technológiával amire nagyon nagy a piaci kereslet van, gyere el a 3 előadásból álló sorozatunkra!

    Az előadás időpontjai:

    2015.11.26 18h
    2015.12.03 18h
    2015.12.10 18h

    Az előadás helyszíne:

    Schönherz Zoltán Kollégium, 102-es terem

    Mind a Webtown, mind a Liferay vezetői Schönherzesek voltak, így pontosan tudjuk mi az ami érdekes és hasznos számodra.

    Gyere el, vegyél részt minden alkalmon és légy vendégünk egy közös sörözésre!

    Elérhetőség:
    Bokros Bálint
