description:
  hu: A jubileumi, 20. Schönherz MeetUp a kreatív mérnöki gondolkodásról szólt a mesterséges intelligencia korában. Négy előadó, négy nézőpont, utána borkóstoló, kötetlen beszélgetés és nyereményjáték. Vendégünk volt Bicskei László államtitkár és Prof. Dr. Imre Sándor, a BME VIK dékánja.
  en: The 20th, jubilee Schönherz MeetUp was about creative engineering thinking in the age of artificial intelligence. Four speakers, four points of view, followed by wine tasting, informal talks and a prize draw. Our guests included state secretary László Bicskei and Prof. Dr. Sándor Imre, dean of BME VIK.
