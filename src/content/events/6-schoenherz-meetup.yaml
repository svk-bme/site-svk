description:
  hu: |-
    VI. SCHÖNHERZ MEETUP
    Az űrkutatás és űrtechnológia témakörében.

    A Schönherz Vállalati Kapcsolatok immáron hatodik alkalommal rendezi meg a Schönherz Meetup néven ismert egész estés rendezvényét, amely lehetőséget nyújt a hallgatóknak bepillantani egy izgalmas témába négy előadáson keresztül.

    A prezentációk ezúttal az űrkutatás és űrtechnológia témaköröket ölelik fel, és a kérdéskör szakmai, kutatási és szociológiai aspektusait állítják középpontba. Az est hangulatáért Litkai Gergely humorista felel, majd rendezvényünk egy kellemes borkóstolóval zárul.

    http://meetup.sch.bme.hu/

