title:
  hu: Internet of Things és a Big Data vállalati felhasználása
start: 2015-04-15T18:00
end: ""
place:
  hu: Schönherz Kollégium, 102-es terem
speaker: null
description:
  hu: |-
    A következő témákról lesz szó az előadás során:

    -          Az Internet of Things meghatározása, technológiai építőelemei, és üzleti értéke a vállalatok számára
    -          Hogyan lehet az IoT megoldások által előállított hatalmas adatmennyiséget Big Data technológiákkal feldolgozni, értelmezni, és intelligens üzleti folyamatokká konvertálni
    -          Példák olyan IoT alapú üzleti megoldásokra, amelyek már jelenleg is rendelkezésre állnak, és különféle ipari és kereskedelmi folyamatokat tesznek hatékonyabbá
    -          Az Internet of Things és Big Data együttes megoldásainak architektúrája és a technológiai stack, amit az SAP kifejlesztett ennek kezelésére
    -          Műszaki kihívások és problémák, amelyeket az IoT alapú rendszerek fejlesztése során meg kell oldani
    --------------------------

