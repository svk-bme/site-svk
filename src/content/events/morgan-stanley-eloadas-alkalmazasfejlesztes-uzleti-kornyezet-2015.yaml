description:
  hu: |-
    Október 21-én, szerdán 18:30-tól a 102-es teremben Morgan Stanley előadás lesz Alkalmazásfejlesztés témában.

    Ha gondolkodtál már azon, hogy miben más egy házifeladatot és egy valóban éles üzembe kerülő alkalmazást elkészíteni, gyere és hallgasd meg, mi mit tapasztaltunk!

    Hogyan lehet azt megcsinálni, amire valóban szükség van?
    Mitől lesz az elkészült alkalmazás megbízható?
    A piaci bevezetésig szükséges idő, a befektetés megtérülési rátája, a fejlesztés és üzelmetetés együttes költsége és sok más izgalmas üzleti aspektus, amit figyelembe veszünk.
