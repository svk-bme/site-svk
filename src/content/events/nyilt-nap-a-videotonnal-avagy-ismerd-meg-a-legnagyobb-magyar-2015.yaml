title:
  hu: Nyílt nap a Videotonnál- avagy ismerd meg a legnagyobb magyar vállalatot!
start: 2015-06-05T08:30
end: ""
place:
  hu: Székesfehérvár
speaker: null
description:
  hu: |-
    Gyere, és pillants bele, milyen a legnagyobb magyar tulajdonú cég hétköznapja!
    Minden egyetemistát sok szeretettel várunk, hiszen nálunk végtelen lehetőség nyílik bármilyen műszaki érdeklődésű fiatal számára!

    Kérjük, részvételi szándékod az alábbi form kitöltésével jelezd felénk!

    BUSZINDULÁS: 8.30-kor a Schönherz Kollégium elől

    Program:

    - 10.00 – 11.00 Hogyan vált az egykori vadásztölténygyár Európa egyik legjelentősebb szerződéses gyártójává?
    - 11.00 – 12.00 Pizzázás, és kötetlen beszélgetés a vállalatcsoport két vezérigazgatójával, akik szintén a BME hallgatói voltak egykor, és mára a leggazdagabb magyarok top listáján találod őket
    - 12.00 – 14.30 VIDEOTON– Minden, ami gyártás, avagy gyárlátogatás két VIDEOTON tagvállalatnál
    - 14.30 – 15.30 Karrier a legnagyobb magyar nagyvállalatnál – próbainterjú lehetőség
