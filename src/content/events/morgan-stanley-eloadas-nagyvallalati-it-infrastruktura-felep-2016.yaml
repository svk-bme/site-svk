description:
  hu: |-
    Kíváncsi vagy milyen komponensekből épül fel egy nagyvállalati infrastruktúra?
    Szeretnél hallani a gyakorlati, való életből szerzett tapasztalatokról és módszerekről, amiket egy nagyvállalati környezet nyújt?
    Ha bármelyik kérdésre igen a válasz, gyere el és vegyél részt a Morgan Stanley következő előadásán, ahol a cég IT infrastruktúra üzemeltetői osztják meg tapasztalataikat és válaszolnak kérdéseidre!
