description:
  hu: |-
    A Morgan Stanley Pricing and Risk csapat feladata az államkötvények és származtatott termékeknek a valósidejű árazása. Ebben a környezetben különösen fontos, hogy nagy mennyiségben, rövid válaszidővel számoljunk.
    A következő szakmai előadásunkon a következő témákat fogjuk érinteni:
    - Miért pont C++?
    - C++ alacsony késleltetésű környezetben,
    - Memóriakezelés,
    - Többszálúság.

    További lehetőségek diákoknak: Gyakornoki és frissdiplomás lehetőségeinket keresd itt:
