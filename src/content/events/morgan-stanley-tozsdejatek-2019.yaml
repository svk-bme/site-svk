description:
  hu: |-
    A tőzsde nem játék. Most mégis azzá tesszük
    neked.
    Szerinted mi mozgatja a piacot: a fundamentumok, a
    véletlen hírek vagy a kollektív pszichológia? Szeretnéd
    kipróbálni magad egy szimulált piacon és összemérni
    piaci elemző képességeidet más játékosokkal?
    Gyere el és megtudod, mit gondol a piac. Nyerni lehet,
    veszíteni nem – ne feledd, ez csak szimuláció!
    A játék időtartama 45 perc. Okostelefonra (vagy egyéb
    webre csatlakoztatható eszközre) szükséged lesz.
