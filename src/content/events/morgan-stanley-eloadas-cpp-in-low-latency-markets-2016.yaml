description:
  hu: |-
    A Morgan Stanley ebben a félévben is ellátogat a Schönherzbe, hogy hasznos szakmai tapasztalattal gazdagítsa a hallgatók tudását.

    "Érdekel, hogy milyen technikákat használunk a piacon? Kíváncsi vagy, hogyan írunk hatékony C++ kódot? Tudni szeretnéd, hogyan lehet jól skálázható programot alkotni?

    Ha csak egyre is igen a válasz, érdemes részt venned a Morgan Stanley következő előadásán, ahol cégünk egyik fejlesztője osztja meg a tapasztalatait és válaszol a kérdéseidre!"

    A résztvevők között egy Páros mozijegyet sorsolunk ki!
