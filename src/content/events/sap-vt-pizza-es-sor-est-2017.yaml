description:
  hu: |-
    Januárban lehetőségetek lesz csatlakozni a világ vezető üzletiszoftver-gyártó cégének tréning programjához, amely a tanulmányaitok mellett is végezhető, versenyképes juttatást kínál és hasznos gyakorlati tapasztalatokkal gazdagítja a tudásotokat.

    November 15-én, szerdán tartunk a Schönherzben egy közös beszélgetést az SAP munkatársaival, ahol hideg sör és finom pizza társaságában mesélni fognak a programról, illetve arról, hogy mivel is foglalkoznak az SAP magyarországi irodájában, ti pedig feltehetitek a kérdéseiteket.

    Első sorban olyanok tudnak részt venni a Vocational Training-en, akik most végzik a BSc utolsó, vagy az MSc első félévét.

    Természetesen azokat is szívesen látjuk az eseményen, akik még nem tartanak itt a tanulmányaikban, de a későbbiekben érdekelné őket a lehetőség.

