description:
  hu: |-
    VII. SCHÖNHERZ MEETUP
    A startupok témakörében.

    A Schönherz Vállalati Kapcsolatok immáron hetedik alkalommal rendezi meg a Schönherz Meetup néven ismert egész estés rendezvényét, amely lehetőséget nyújt a hallgatóknak bepillantani egy izgalmas témába négy előadáson keresztül.

    A prezentációk ezúttal a startupok témakörét ölelik fel, és a kérdéskör szakmai, megvalósítási és társadalmi aspektusait állítják középpontba. Az est hangulatáért Csenki Attila humorista felel, majd rendezvényünk egy kellemes borkóstolóval zárul Sándor Zsolt borásszal. Részletek a honlapon.

    http://meetup.sch.bme.hu/

