description:
  hu: |-
    V. SCHÖNHERZ MEETUP
    A mesterséges intelligencia témakörében.

    A Schönherz Vállalati Kapcsolatok immáron ötödik alkalommal rendezi meg a Schönherz Meetup néven ismert egész estés rendezvényét, amely lehetőséget nyújt a hallgatóknak bepillantani egy izgalmas témába négy előadáson keresztül.

    A prezentációk ezúttal a mesterséges intelligencia témakörét ölelik fel, és a kérdéskör szakmai, kutatási, etikai és pszichológiai aspektusait állítják középpontba. Az est hangulatáért Mogács Dániel humorista felel, majd rendezvényünk egy kellemes borkóstolóval zárul.

    http://meetup.sch.bme.hu/

