    XIV. SCHÖNHERZ MEETUP - Smart Cities

    A Schönherz Vállalati Kapcsolatok immáron tizennegyedik alkalommal rendezi meg a Schönherz Meetup néven ismert egész estés rendezvényét, amely lehetőséget nyújt a hallgatóknak bepillantani egy izgalmas témába négy előadáson keresztül.

    NYEREMÉNYJÁTÉK:

    Egy kis meglepetéssel készülünk nektek.
    Összesen 40.000Ft értékben készülünk nektek nyereményekkel, melyek a legjobb kérdéseket feltevők között kerülnek kisorsolásra az est végén!

    ELŐADÁSOK:

    - Mitől okos a jövő okos városa?
    /Dr. Sallai Gyula, Professor Emeritus, BME/

    - Kiberbiztonság az „okosodó” villamosenergia szektorban.
    /Dr. Krasznay Csaba, Egyetemi docens, NKE/

    - Miért tekinthető az Uber egyszerre smart- és dumb city alkalmazásnak?
    /Dr. Vida Rolland, Egyetemi docens, BME/

    - Gondolatébresztő hazai és külföldi okos város példák.
    /Orbán Kristóf, Települési Technológiák Osztályvezető, Lechner Nonprofit Kft./

    /A meghívók az eseményt megelőzően 15-20 perccel kerülnek kiküldésre!/
