description:
  hu: |-
    Bosch előadás a kollégiumban

    Motorvezérlők forrasztási folyamat- és megbízhatóság-technológiája

    Az előadás során megismerkedünk az autóipar globális és lokális helyzetével, mely a Bosch csoport egyik kiemelt üzletága. Körbejárjuk, a motorvezérlő alapvető felépítését, funkcióit, továbbá, hogy milyen kritériumokat (hatások, terhelések) kell figyelembe vennünk a fejlesztésük során, biztosítva optimális, hatékony és megbízható működését. Megismerkedhetünk a budapesti Fejlesztő Központ egyik osztályával, ismertetve az ott zajló forrasztási folyamat, forraszkötés megbízhatósági, press-fit és laborban folyó technológiákat, fejlesztéseket. A fejlesztésen túl betekintünk a több országban történő gyártási folyamatokba is.
