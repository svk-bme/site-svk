description:
  hu: |-
    2022. március 24-én 18:00 órakor a SnapSoft ’Szakmai Estet’ tart a Schönherz Kollégium 102-es termében.

    Kerényi Dániel (CEO), és Károlyi Dávid (Cloud Engineer) látogat el hozzánk, akik az alábbi előadásokkal készülnek nektek!

    ’SnapSoft Story: Út a Schönherztől Amerikáig’ – Kerényi Dániel

    ’Felhő Forradalom: Ezt érdemes tudnod az AWS Cloudról’ – Károlyi Dávid

    Az est során PIZZA-val, SÖR-rel, és PS5-tel is készülnek nektek a SnapSoftosok!

    Gyertek el minél többen, és ismerjétek meg őket!
