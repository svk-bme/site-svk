description:
  hu: |-
    Ritka esemény, amikor merőben új eszközkategória jelenik meg a világon. Az is ritka, amikor valósággá válik valami, amit idáig csak science fictionben láthattunk. A Microsoft HoloLens mindkettő. Olyan szemüveg, ami fizikai valóságunkat hologramokkal egészíti ki – valóságosnak tűnő, körbejárható 3D tárgyakkal, amik belesimulnak a ténylegesen létező világba.
    A mérnökök a munkapadon fekvő, járó motor működését tanulmányozzák – aminek a gyártása csak jövőre indul. A vevő bejárja bebútorozott új otthonát, ami a valóságban még csak csupasz falakból áll. A szerelőnek a diszpécser 3D nyilakat rajzol a térbe, amik mutatják, hogy hol kell beavatkoznia. A játékos virtuális fegyvert lát a kezére csatolva, amit a saját nappalijában megjelenő szörnyek ellen használ. A Solaria kolónián 3D hologramokként tartanak konferenciabeszélgetést az űrászok.
    Az utolsóhoz az űrutazásnak még fejlődnie kell kissé, de a szemüveg már megérkezett! (És Windows 10-et futtat.)

    Ha szeretnél többet megtudni a HoloLensről, gyere el május 3-án kedden 18 órától kezdődő Microsoft Szakmai Estre a Schönherz Kollégiumba.

    Előadók:
    Velvárt András, Response Kft, Emerging Experiences MVP
    Farkas Bálint, Technical Evangelist, Microsoft
