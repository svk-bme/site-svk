description:
  hu: |-
    Érdekel az loT és az okos eszközök világa? Szeretnéd tudni, mi hajtja? Szívesen kísérleteznél egy olyan egyszerű platformon, mint az Arduino?

    Gyere el a Arduino Matter Solution by Silicon Labs előadására

    Megmutatjuk, hogyan lehet egy RGB LED szalagot vezérelni hangparanccsal, telefonról, és emellett szenzoradatokat Google Nest Hub-on keresztül Apple 4K TV-n megjeleníteni. Mindezt egy Arduino környezet és Matter library, valamint egy Silicon Labs fejlesztőkit felhasználásával.

    Demó és beszélgetés a Silicon Labs fejlesztőmérnökeivel, élőben.

    Október 10. (csütörtök) 18:00
    Schönherz ENT

    Az előadás végén pizzával várjuk az érdeklődőket!
