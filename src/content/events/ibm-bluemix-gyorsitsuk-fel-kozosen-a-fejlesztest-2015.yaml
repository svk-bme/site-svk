place:
  hu: Schönherz Kollégium, 102-es terem
speaker: null
description:
  hu: |-
    Szeretnél megismerni egy piacvezető felhőszolgáltatást? Vannak innovatív ötleteid, de azok megvalósításától eltántorítanak a fejlesztés nehézségei?

    Kíváncsi vagy, hogy mostani tudásodat hogyan tudnád kamatoztatni?

    Ezekre a kérdésekre mind választ kaphatsz, ha 2015. november 25-én 18:00-kor eljössz a Schönherz-be, és meghallgatod az IBM Bluemix felhő szolgáltatásáról szóló előadását.

    Használd fel a világ legnépszerűbb nyílt-forráskódú technológiáit új alkalmazások fejlesztésére. Ne szabj határt a képzeletednek, valósítsd meg az ötleteid! Engedd a Bluemix-nek, hogy megkönnyítse a munkádat!
    Bővebb információkat a Bluemix-ről itt találtok: https://www.dropbox.com/s/hrcdcgilm7cfazi/ibm_bluemix_pr.pdf?dl=0
