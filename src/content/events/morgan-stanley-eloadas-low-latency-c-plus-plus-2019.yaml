  hu: |-
    Technikák low-latency C++ környezetben

    Érdekel, hogyan fejlesztünk többszálú környezetben microservice-
    eket? Kíváncsi vagy néhány napjainkban használt C++fogásra? Ha
    a válaszod igen, akkor gyere el előadásunkra, ahol C++
    technikákkal találkozhatsz többszálú környezetben, illetve
    megtudhatod mi a titka a válaszidők alacsonyan tartásának.

    A részvétel ingyenes!
