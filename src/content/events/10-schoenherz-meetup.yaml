description:
  hu: |-
    X. SCHÖNHERZ MEETUP
    Deep learning

    A Schönherz Vállalati Kapcsolatok immáron tizedik alkalommal rendezi meg a Schönherz Meetup néven ismert egész estés rendezvényét, amely lehetőséget nyújt a hallgatóknak bepillantani egy izgalmas témába négy előadáson keresztül.

    A prezentációk ezúttal a deep learning témakörét ölelik fel, pontosan mi is az, és milyen szakmai felhasználása létezik napjainkban. Az est hangulatáért Beliczai Balázs humorista felel, majd rendezvényünk egy kellemes borkóstolóval zárul.

    Az este előadásai:

    Deep Learning - Mitől mély a tanulás?
    -Nagy Péter Egyetemi docens, BME-TMIT

    Generatív Mély Neuronhálók
    -Dr.Csapó Tamás Gábor egyetemi docens, BME-TMIT

    Mesterséges intelligencia és szimulált sejtek a rákkutatásban
