recruitment:
  status: closed
  opens: 2027-03-01T00:00
  closes: 2027-03-21T23:59
  expected_text:
    hu: A toborzás általában év elején, március környékén indul. Hagyd meg az elérhetőséged, és szólunk, amikor jelentkezhetsz!
    en: Recruitment usually starts at the beginning of the year, around March. Leave your details and we will let you know when you can apply.
  intro:
    hu: |-
      Elindult a toborzás! Olyan hallgatókat keresünk, akiket érdekel a cégek és a hallgatók közötti kapcsolat építése.

      **A folyamat:** jelentkezés motivációs levéllel és egy rövid bemutatkozó prezentációval, majd személyes beszélgetés.
    en: |-
      Recruitment is open! We are looking for students who are interested in building connections between companies and students.

      **The process:** apply with a motivation letter and a short introduction presentation, followed by a personal interview.
