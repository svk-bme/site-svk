description:
  hu: Háttérirodai vezetőként a hallgatói szervezet adminisztratív és szervezési feladatainak gördülékeny működéséért felelek. Feladataim közé tartozik a belső dokumentáció kezelése, az események logisztikai támogatása, valamint a mindennapi operatív folyamatok koordinálása. Törekszem arra, hogy a szervezet működése rendezett, átlátható és hatékony legyen, miközben támogatást nyújtok a csapatok munkájához. Fontos számomra a precizitás, a rendszerszemlélet és a megbízhatóság, amelyek elengedhetetlenek a stabil háttér biztosításához.
  en: As the back office manager, I am responsible for ensuring the smooth execution of the student organization’s administrative and organizational tasks. My duties include managing internal documentation, providing logistical support for events, and coordinating day-to-day operational processes. I strive to maintain an organized, transparent, and efficient workflow while supporting the work of all teams. Precision, a systematic approach, and reliability are key values I uphold to provide a solid foundation for the organization’s operations.
