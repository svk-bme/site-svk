description:
  hu: Az employer branding csapat vezetőjeként a hallgatói szervezet arculatának és külső megjelenésének stratégiai irányításáért felelek. Feladataim közé tartozik a kommunikációs tevékenységek összehangolása, a szervezeti értékek tudatos képviselete és a partnerekkel való kapcsolatépítés támogatása. Törekszem arra, hogy a szervezet hiteles, professzionális és vonzó képet mutasson mind a hallgatói közösség, mind a külső partnerek felé. Fontos számomra a csapaton belüli együttműködés és a fejlődés ösztönzése, miközben a szervezet hosszú távú ismertségét és reputációját erősítem.
  en: As the leader of the employer branding team, I am responsible for the strategic management of the student organization’s image and external presence. My duties include coordinating communication activities, representing the organization’s values, and supporting relationship-building with partners. I strive to ensure that the organization presents an authentic, professional, and engaging image to both the student community and external stakeholders. I place great emphasis on collaboration and team development while continuously strengthening the organization’s visibility and reputation.
