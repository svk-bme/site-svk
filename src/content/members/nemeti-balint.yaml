description:
  hu: Gazdasági vezetőként a hallgatói szervezet pénzügyi működésének átlátható és felelős irányításáért felelek. Feladataim közé tartozik a költségvetés tervezése, a kiadások és bevételek nyomon követése, valamint a pénzügyi döntések előkészítése és dokumentálása. Törekszem a pénzügyi stabilitás és fenntarthatóság megőrzésére, miközben támogatást nyújtok a projektek megvalósításához és a szervezet fejlődéséhez. Fontos számomra a precizitás, az átláthatóság és a bizalom, amelyek a szervezet hosszú távú működésének alapját képezik.
  en: As the financial manager, I am responsible for the transparent and accountable management of the student organization’s finances. My tasks include budgeting, monitoring expenses and revenues, and preparing and documenting financial decisions. I strive to maintain financial stability and sustainability while supporting project implementation and organizational growth. Precision, transparency, and trust are essential to me, as they form the foundation of the organization’s long-term success.
