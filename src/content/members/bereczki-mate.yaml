description:
  hu: Kapcsolattartóként a hallgatói szervezet és külső partnerei közötti kommunikációért és együttműködések fenntartásáért felelek. Feladataim közé tartozik a partnerekkel való kapcsolatok ápolása, új együttműködési lehetőségek felkutatása, valamint a szervezet képviselete különböző rendezvényeken és egyeztetéseken. Törekszem arra, hogy a kommunikáció mindig professzionális, nyitott és eredményorientált legyen. Fontos számomra, hogy a szervezet megbízható, hiteles és együttműködő partnerként jelenjen meg minden kapcsolatában.
  en: As an account manager, I am responsible for maintaining communication and collaboration between the student organization and its external partners. My tasks include nurturing existing relationships, identifying new partnership opportunities, and representing the organization at events and meetings. I strive to ensure that all communication is professional, transparent, and goal-oriented. It is important to me that the organization is perceived as a reliable, credible, and cooperative partner in all interactions.
