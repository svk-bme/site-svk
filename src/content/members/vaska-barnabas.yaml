description:
  hu: Operatív vezetőként a hallgatói szervezet mindennapi működésének koordinálásáért és a belső folyamatok hatékony szervezéséért felelek. Feladataim közé tartozik a tagok közötti együttműködés támogatása, a projektek ütemezésének és megvalósításának felügyelete, valamint a szervezeti célok operatív szintű megvalósítása. Törekszem a gördülékeny munkavégzésre, az információáramlás biztosítására és a problémák gyors, megoldásorientált kezelésére. Fontos számomra, hogy a szervezet működése átlátható, hatékony és a tagok számára támogató legyen.
  en: As the operations manager, I am responsible for coordinating the daily activities and ensuring the efficient organization of internal processes within the student organization. My duties include supporting collaboration between members, overseeing project timelines and implementation, and ensuring the operational realization of organizational goals. I strive to maintain smooth workflows, facilitate clear communication, and address challenges with a solution-oriented mindset. Transparency, efficiency, and a supportive environment are central to how I approach my work.
