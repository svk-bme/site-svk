note: Sent once to everyone on the confirmed interest list when the recruitment season opens, or on the date below if set. {link} opens the application form pre-filled.
enabled: true
# A test copy goes here whenever the text changes (empty: none)
test_to: ''
subject:
  hu: Elindult a toborzás az SVK-ba
  en: Recruitment at SVK is open
body:
  hu: |-
    Szia {name}!

    Elindult a toborzás! Jelentkezni {date}-ig tudsz. Az alábbi link megnyitja a jelentkezési űrlapot, előre kitöltve a korábban megadott adataiddal:

    {link}

    Üdv,
    SVK
  en: |-
    Hi {name},

    Recruitment is open! You can apply until {date}. The link below opens the application form, pre-filled with the details you gave us earlier:

    {link}

    Best,
    SVK
