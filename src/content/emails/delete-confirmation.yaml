note: Sent when someone asks for their data to be deleted on the privacy page. {link} deletes all their data.
enabled: true
# A test copy goes here whenever the text changes (empty: none)
test_to: ''
subject:
  hu: Erősítsd meg az adataid törlését
  en: Confirm the deletion of your data
body:
  hu: |-
    Szia!

    Valaki – remélhetőleg te – kérte, hogy töröljük az ehhez az e-mail-címhez tartozó összes adatot az SVK űrlapjaiból. A törléshez kattints az alábbi linkre (24 óráig érvényes):

    {link}

    Ha nem te kérted, nincs teendőd.

    Üdv,
    SVK
  en: |-
    Hi,

    Someone – hopefully you – asked us to delete all data stored for this email address in SVK's forms. Click the link below to delete it (valid for 24 hours):

    {link}

    If you did not ask for this, you do not need to do anything.

    Best,
    SVK
