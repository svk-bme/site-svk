title:
  hu: Jelentkezés az SVK-ba
  en: Application to SVK
order: 3
purpose:
  hu: |-
    Az adataidat és a feltöltött anyagaidat a jelentkezésed elbírálásához használjuk.

    A fájlok feltöltéséhez a Google Forms kéri, hogy jelentkezz be egy Google-fiókkal.
  en: |-
    We use your data and the files you upload to evaluate your application.

    Google Forms asks you to sign in with a Google account to upload files.
collected:
  hu: Név, e-mail-cím, tanulmányok, hátralévő aktív félévek száma, a választható kérdésekre adott válaszok, motivációs levél és bemutatkozó prezentáció.
  en: Name, email address, studies, number of active semesters left, your answers to the optional questions, motivation letter and introduction presentation.
retention:
  hu: A toborzási időszak lezárulta után 3 hónapig őrizzük. A felvett tagok adatai az SVK belső nyilvántartásába kerülnek.
  en: Kept for 3 months after the recruitment season closes. Data of accepted members moves to SVK's internal records.
withdraw:
  hu: A jelentkezésed visszavonásához írj nekünk a lap alján megadott címre.
  en: To withdraw your application, write to us at the address at the bottom of this page.
form:
  hu: ''
  en: ''
