title:
  hu: Jelentkezés eseményre
  en: Event registration
order: 1
purpose:
  hu: Az adataidat az esemény megszervezéséhez, a résztvevők nyilvántartásához és a jelentkezéssel kapcsolatos e-mailekhez (például visszaigazolás, emlékeztető, belépési kód) használjuk.
  en: We use your data to organize the event, keep track of attendees, and send emails about your registration (for example a confirmation, a reminder or an entry code).
collected:
  hu: Név, e-mail-cím, tanulmányok és az adott eseménynél feltett további kérdésekre adott válaszok. Egyes eseményeknél a megjelenésedet is rögzítjük.
  en: Name, email address, studies, and your answers to any extra questions asked for the event. At some events we also record that you attended.
retention:
  hu: Az esemény után 90 napig őrizzük, utána töröljük.
  en: Kept for 90 days after the event, then deleted.
withdraw:
  hu: A jelentkezésed visszavonásához és az adataid törléséhez írj nekünk a lap alján megadott címre.
  en: To cancel your registration and have your data deleted, write to us at the address at the bottom of this page.
# Each event has its own registration form (Events → Registration form).
