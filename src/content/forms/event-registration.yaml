title:
  hu: Jelentkezés eseményre
  en: Event registration
order: 1
purpose:
  hu: Az adataidat az esemény megszervezéséhez, a résztvevők nyilvántartásához és a belépéshez használjuk. A jelentkezés után e-mailben küldünk egy QR-kódot, amelyet a bejáratnál beolvasunk, és az esemény előtt egy emlékeztetőt.
  en: We use your data to organize the event, keep track of attendees and check you in. After you register, we email you a QR code that we scan at the entrance, and a reminder before the event.
collected:
  hu: Név, e-mail-cím, tanulmányok, az adott eseménynél feltett további kérdésekre adott válaszok, a belépési kódod, valamint hogy megérkeztél-e és mikor.
  en: Name, email address, studies, your answers to any extra questions asked for the event, your entry code, and whether and when you arrived.
retention:
  hu: Az esemény után 90 napig őrizzük, utána töröljük.
  en: Kept for 90 days after the event, then deleted.
withdraw:
  hu: A jelentkezésed visszavonásához és az adataid törléséhez írj nekünk a lap alján megadott címre.
  en: To cancel your registration and have your data deleted, write to us at the address at the bottom of this page.
# Each event has its own registration form (Events → Registration form).
