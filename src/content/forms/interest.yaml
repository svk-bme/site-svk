title:
  hu: Érdeklődés a toborzás iránt
  en: Interest in joining
order: 2
purpose:
  hu: Az adataidat arra használjuk, hogy e-mailben szóljunk, amikor elindul a toborzás. A válaszaid segítenek a toborzás tervezésében.
  en: We use your data to email you when recruitment starts. Your answers help us plan recruitment.
collected:
  hu: Név, e-mail-cím, tanulmányok, hátralévő aktív félévek száma, valamint a választható kérdésekre adott válaszok.
  en: Name, email address, studies, number of active semesters left, and your answers to the optional questions.
retention:
  hu: A következő toborzási időszak végéig, de legalább 12 hónapig a feliratkozástól számítva.
  en: Until the end of the next recruitment season, but at least 12 months from signing up.
withdraw:
  hu: Ha már nem szeretnél tőlünk levelet kapni, válaszolj bármelyik levelünkre, vagy írj nekünk, és töröljük az adataidat a listáról.
  en: If you no longer want our emails, reply to any of them or write to us, and we will remove your data from the list.
form:
  hu: https://docs.google.com/forms/d/e/1FAIpQLSflOwhoh3FVAb1VMkl-n3w5ffC5Rs0kKCcIkjfUDm-3PjHj1A/viewform
  en: ''
